<section id="contenedor">
    <header>
        <img src="assets/logo.png" alt="Logo">
        <h2>Frameworks</h2>
        <ul>
            <li>
                <a [routerLink]="authService.esAdministrador() ? '/nuevo-usuario' : null"
                   [class.deshabilitado]="!authService.esAdministrador()">
                    Nuevo Usuario
                </a>
            </li>
            <li><a>Bitacora</a></li>
        </ul>
    </header>

    <section id="main">
        <div>
            <h2>Datos</h2>
            <section>
                <p *ngIf="cargando()">Cargando datos...</p>
                <p *ngIf="errorCarga()">{{ errorCarga() }}</p>
                <table class="tablaDatos" *ngIf="!cargando() && !errorCarga()">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let dato of listaDatos()"
                            [class.seleccionada]="filaSeleccionada()?.idDato === dato.idDato"
                            (click)="seleccionarFila(dato)">
                            <td>{{ dato.nombreDato }}</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
        <div>
            <button class="btnInfo" [disabled]="!authService.puedeNuevoDato()">Nuevo</button>
            <button class="btnInfo" [disabled]="!authService.puedeDesplegar()">Desplegar</button>
            <button class="btnInfo" [disabled]="!authService.puedeEditar()">Editar</button>
            <button class="btnInfo" [disabled]="!authService.puedeEliminar()">Eliminar</button>
        </div>
    </section>

    <footer>
        Usuario <strong>{{ nombreUsuario }}</strong>
    </footer>
</section>
