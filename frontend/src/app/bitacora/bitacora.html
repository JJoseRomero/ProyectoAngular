<section id="contenedorBitacora">
    <header>
        <h2>Bitacora</h2>
    </header>

    <section id="cuerpoBitacora">
        <p *ngIf="cargando()">Cargando bitacora...</p>
        <p *ngIf="errorCarga()">{{ errorCarga() }}</p>

        <table class="tablaBitacora" *ngIf="!cargando() && !errorCarga()">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Acceso</th>
                    <th>Sistema Operativo</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let registro of registros()">
                    <td>{{ registro.nombreUsuario }}</td>
                    <td>{{ formatearFecha(registro.fechaHoraBitacora) }}</td>
                    <td>{{ registro.SoBitacora }}</td>
                </tr>
            </tbody>
        </table>

        <div class="contenedorBoton">
            <button class="btnRegresar" (click)="regresar()">Regresar</button>
        </div>
    </section>
</section>
